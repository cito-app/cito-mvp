<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración — Cito.mx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#3B82F6',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            card: '8px',
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-brand rounded-card flex items-center justify-center">
          <span class="text-white font-bold text-sm">C</span>
        </div>
        <h1 class="text-xl font-bold text-gray-900">Cito<span class="text-brand">.mx</span></h1>
      </div>
      <div class="flex items-center gap-2 bg-green-50 border border-green-200 rounded-card px-3 py-1.5">
        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
        <span class="text-sm font-medium text-green-700">Servidor Activo</span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Tarjetas de resumen -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
      <div class="bg-white rounded-card shadow-sm border border-gray-200 p-6">
        <p class="text-sm font-medium text-gray-500 mb-1">Total de Citas</p>
        <p id="total-citas" class="text-3xl font-bold text-gray-900">—</p>
      </div>
      <div class="bg-white rounded-card shadow-sm border border-gray-200 p-6">
        <p class="text-sm font-medium text-gray-500 mb-1">Citas Pendientes</p>
        <p id="citas-hoy" class="text-3xl font-bold text-brand">—</p>
      </div>
    </div>

    <!-- Tabla de citas -->
    <div class="bg-white rounded-card shadow-sm border border-gray-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-200 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 id="table-title" class="text-lg font-semibold text-gray-900">Citas pendientes</h2>
          <p id="table-subtitle" class="text-xs text-gray-500 mt-0.5">Solo citas por atender hoy</p>
        </div>
        <div class="flex items-center gap-3">
          <button
            id="toggle-historial"
            type="button"
            onclick="toggleHistorial()"
            class="inline-flex items-center px-4 py-2 text-sm font-medium text-brand bg-blue-50 border border-blue-200 rounded-card hover:bg-blue-100 transition-colors">
            Ver Historial
          </button>
          <span id="last-updated" class="text-xs text-gray-400"></span>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-gray-50 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">
              <th class="px-6 py-3">Cliente</th>
              <th class="px-6 py-3">Teléfono</th>
              <th class="px-6 py-3">Servicio</th>
              <th class="px-6 py-3">Fecha/Hora</th>
              <th class="px-6 py-3">Estado</th>
              <th class="px-6 py-3 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="citas-body" class="divide-y divide-gray-100">
            <tr>
              <td colspan="6" class="px-6 py-10 text-center text-gray-400">
                Cargando citas...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://pbdprwulwnsjrzvolzut.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Rc6zXAMP7diNd2DHdkPp6Q_IRRUpX9I';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const citasBody = document.getElementById('citas-body');
    const totalCitasEl = document.getElementById('total-citas');
    const citasHoyEl = document.getElementById('citas-hoy');
    const lastUpdatedEl = document.getElementById('last-updated');
    const tableTitleEl = document.getElementById('table-title');
    const tableSubtitleEl = document.getElementById('table-subtitle');
    const toggleHistorialBtn = document.getElementById('toggle-historial');

    let allCitas = [];
    let showHistory = false;

    function getEstado(cita) {
      return cita.estado || 'pendiente';
    }

    function getFilteredCitas() {
      if (showHistory) {
        return allCitas;
      }

      return allCitas.filter((cita) => getEstado(cita) === 'pendiente');
    }

    function toggleHistorial() {
      showHistory = !showHistory;
      toggleHistorialBtn.textContent = showHistory ? 'Ver Solo Pendientes' : 'Ver Historial';
      tableTitleEl.textContent = showHistory ? 'Historial de citas' : 'Citas pendientes';
      tableSubtitleEl.textContent = showHistory
        ? 'Incluye completadas y canceladas'
        : 'Solo citas por atender hoy';
      renderCitas(getFilteredCitas());
    }

    window.toggleHistorial = toggleHistorial;

    function formatTelefono(telefono) {
      if (!telefono) return '—';
      const digits = telefono.replace('@c.us', '').replace(/\D/g, '');
      if (digits.length === 13 && digits.startsWith('521')) {
        return `+52 ${digits.slice(3, 5)} ${digits.slice(5, 9)} ${digits.slice(9)}`;
      }
      return `+${digits}`;
    }


    function estadoBadge(estado) {
      const map = {
        pendiente: 'bg-yellow-50 text-yellow-700 border-yellow-200',
        completada: 'bg-green-50 text-green-700 border-green-200',
        cancelada: 'bg-red-50 text-red-700 border-red-200',
      };
      const cls = map[estado] || map.pendiente;
      const label = estado || 'pendiente';
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-card border text-xs font-medium capitalize ${cls}">${label}</span>`;
    }

    function renderCitas(citas) {
      const pendientes = allCitas.filter((c) => getEstado(c) === 'pendiente');

      totalCitasEl.textContent = showHistory ? allCitas.length : pendientes.length;
      citasHoyEl.textContent = pendientes.length;
      lastUpdatedEl.textContent = `Actualizado: ${new Date().toLocaleTimeString('es-MX')}`;

      if (citas.length === 0) {
        citasBody.innerHTML = `
          <tr>
            <td colspan="6" class="px-6 py-10 text-center text-gray-400">
              ${showHistory ? 'No hay citas en el historial.' : 'No hay citas pendientes.'}
            </td>
          </tr>`;
        return;
      }

      citasBody.innerHTML = citas.map((cita) => {
        const estado = getEstado(cita);
        const isPending = estado === 'pendiente';
        const nombre = cita.nombre || cita.cliente_nombre || '—';
        const telefono = cita.telefono || cita.cliente_telefono;

        return `
          <tr class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 font-medium text-gray-900">${nombre}</td>
            <td class="px-6 py-4 text-gray-600">${formatTelefono(telefono)}</td>
            <td class="px-6 py-4 text-gray-700">${cita.servicio || '—'}</td>
            <td class="px-6 py-4 text-gray-600 whitespace-nowrap">${cita.fecha_hora || '—'}</td>
            <td class="px-6 py-4">${estadoBadge(estado)}</td>
            <td class="px-6 py-4 text-right whitespace-nowrap">
              ${isPending ? `
                <button
                  type="button"
                  onclick="actualizarEstado('${cita.id}', 'completada')"
                  class="inline-flex items-center px-3 py-1.5 mr-1 text-xs font-semibold text-white bg-green-600 border border-green-600 rounded-card hover:bg-green-700 transition-colors shadow-sm">
                  Completar
                </button>
                <button
                  type="button"
                  onclick="actualizarEstado('${cita.id}', 'cancelada')"
                  class="inline-flex items-center px-3 py-1.5 text-xs font-semibold text-white bg-red-600 border border-red-600 rounded-card hover:bg-red-700 transition-colors shadow-sm">
                  Cancelar
                </button>
              ` : `<span class="text-xs text-gray-400">—</span>`}
            </td>
          </tr>`;
      }).join('');
    }

    async function fetchCitas() {
      const { data, error } = await supabaseClient
        .from('citas')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        citasBody.innerHTML = `
          <tr>
            <td colspan="6" class="px-6 py-10 text-center text-red-500">
              Error al cargar citas: ${error.message}
            </td>
          </tr>`;
        console.error('Error Supabase:', error);
        return;
      }

      allCitas = data || [];
      renderCitas(getFilteredCitas());
    }

    async function actualizarEstado(id, nuevoEstado) {
      const { error } = await supabaseClient
        .from('citas')
        .update({ estado: nuevoEstado })
        .eq('id', id);

      if (error) {
        alert(`No se pudo actualizar la cita: ${error.message}`);
        console.error('Error al actualizar:', error);
        return;
      }

      await fetchCitas();
    }

    window.actualizarEstado = actualizarEstado;

    function subscribeToCitasChanges() {
      supabaseClient
        .channel('custom-insert-channel')
        .on(
          'postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'citas' },
          (payload) => {
            console.log('Nueva cita detectada en tiempo real:', payload.new);
            fetchCitas();
          },
        )
        .on(
          'postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'citas' },
          (payload) => {
            console.log('Cita actualizada en tiempo real:', payload.new);
            fetchCitas();
          },
        )
        .subscribe((status) => {
          console.log('Canal custom-insert-channel:', status);
        });
    }

    fetchCitas();
    subscribeToCitasChanges();
  </script>
</body>
</html>
