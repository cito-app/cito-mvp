<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador | Cito.mx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center mx-auto font-bold text-2xl">
                C
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Iniciar Sesión</h1>
            <p class="text-sm text-slate-400">Ingresa a la administración de tu negocio</p>
        </div>

        <form id="form-login" onsubmit="iniciarSesion(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Correo Electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    required 
                    placeholder="dueño@negocio.com"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    required 
                    placeholder="••••••••"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500"
                >
            </div>

            <div id="error-message" class="text-xs text-rose-400 bg-rose-950/50 border border-rose-800/50 p-3 rounded-lg hidden"></div>

            <button 
                type="submit" 
                id="btn-login"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition duration-200"
            >
                Entrar al Panel
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = "https://gyfximoxybmkszltzdoj.supabase.co";
        const SUPABASE_KEY = "sb_publishable_E_PbqtffVUMTTXK9tpINkw_poblFV6N";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function iniciarSesion(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const btn = document.getElementById('btn-login');

            errorDiv.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = "Verificando...";

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorDiv.innerText = "Error: " + error.message;
                errorDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Entrar al Panel";
            } else {
                // Redirigir al panel principal cargando la sesión activa
                window.location.href = "index.html";
            }
        }

        // Verificar si ya hay una sesión activa para redirigir directamente
        async function comprobarSesion() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                window.location.href = "index.html";
            }
        }
        comprobarSesion();
    </script>
</body>
</html>
